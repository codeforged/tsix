# /etc/fstab.conf — tabel mount TSIX (dibaca kernel saat boot)
#
# SATU [mount-point] per mount, isinya pasangan `key = value`.
# Aturan format & daftar field lengkap: lihat /etc/fstab.md
#   - mode : oktal eksplisit (0o775) atau desimal (509 = 0o775)
#   - type : ramfs | host | bkfs | netfs

# /tmp → ramfs (sticky) — berkas sementara, jangan ikut persisten
[/tmp]
hostPath = RAM
type     = ramfs
uid      = 0
gid      = 100
mode     = 0o1777
active   = true

# shared host directory (dipakai tukar-berkas dengan host / addon)
[/mnt/shared]
hostPath = shared
type     = host
uid      = 1000
gid      = 100
mode     = 0o775

# backup root dalam SQLite terpisah
[/mnt/sbak]
hostPath = systembak.db
type     = bkfs
uid      = 1000
gid      = 100
mode     = 0o775

# tree sumber repo (read-only) — dipakai paket engine (tpkg) + alat dev
[/hostsrc]
hostPath = src
type     = host
readOnly = true
uid      = 0
gid      = 0
mode     = 0o700
active   = true
