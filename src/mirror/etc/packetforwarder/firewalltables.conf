# /etc/packetforwarder/firewalltables.conf — ACL broker bridge (`forward`)
#
# HANYA dibaca oleh node yang MENJALANKAN `forward` (bridge). Node lain tidak
# pernah membaca berkas ini, sekalipun berkasnya ada di rootfs-nya.
#
# Dibaca saat `forward -s <brokerA> -d <brokerB>` dijalankan, lalu dievaluasi
# untuk SETIAP paket MQTNL yang mau menyeberang lewat bridge itu.
#
# Cakupan: hanya lalu lintas yang LEWAT bridge ini. Node Y tidak "dilindungi"
# dari akses langsung ke broker-nya sendiri — yang dibatasi adalah apa yang
# boleh diteruskan bridge ini dari satu broker ke broker lain.
#
# Semua aturan di bawah DIBERI KOMENTAR secara bawaan → firewall non-aktif,
# jadi `forward` berperilaku persis seperti sebelum fitur ini ada.
#
# ── DUA GAYA PENULISAN ─────────────────────────────────────────────
#
#   DUA ARAH (ringkas)   : allow / deny
#     → cukup salah satu ujung (sumber ATAU tujuan) yang cocok.
#     → dipakai untuk "larang/blokir node ini" tanpa memikirkan arah.
#
#   BERARAH (presisi)    : allow-src / allow-dst / deny-src / deny-dst
#     → hanya melihat sumber, atau hanya melihat tujuan.
#     → dipakai untuk aturan seperti "hanya X yang boleh mengakses Y".
#
# Deny selalu menang atas allow. Semua allow yang DIISI harus lolos (AND).
#
# ── AWAS: BALASAN SELALU BERBALIK ARAH ─────────────────────────────
#
#   Paket X→Y : src=X, dst=Y
#   Balasannya: src=Y, dst=X
#
#   Jadi `allow-dst = "tsix-z"` membuat X→Z lolos, TETAPI balasan Z→X
#   ikut terblokir (dst balasan = X, bukan Z). Untuk whitelist berarah,
#   daftarkan kedua sisi:
#
#     allow-dst = "tsix-z", "tsix-c"
#     allow-src = "tsix-z", "tsix-c"
#
#   Hal yang sama berlaku di [port]: port tujuan balasan = port aplikasi
#   klien, bukan port service.
#
# ── CONTOH SKENARIO ────────────────────────────────────────────────
#
# 1) Node Y tidak boleh diakses dari broker lain, node lain tetap bisa:
#
#      [address]
#      deny = "tsix-y"
#
# 2) Hanya X (dan X') yang boleh menyentuh broker ini:
#
#      [address]
#      allow-src = "wintsix", "wintsix_2"
#      allow-dst = "wintsix", "wintsix_2"
#
# 3) Z boleh diakses, tetapi hanya lewat port 24 dan 80:
#
#      [address]
#      allow-dst = "tsix-z"
#      allow-src = "tsix-z"
#      [port]
#      allow-dst = 24, 80
#      deny-dst  = 22
#
# Periksa hasilnya tanpa menjalankan bridge:
#   forward --fw
#   forward --fw-check wintsix:5000 tsix-y:24
#
# Format nilai mengikuti berkas .conf TSIX: kutip opsional, pemisah koma,
# `#`/`;` komentar. `"*"` berarti semua.

[address]
# ── dua arah (ringkas) ──
# allow = "*"                        # semua alamat boleh (default)
# allow = "tsix-z", "tsix-c"         # hanya alamat ini yang boleh
# deny  = "tsix-y", "tsix-d"         # alamat ini diblokir
# deny  = "*"                        # blokir semua (hati-hati!)

# ── berarah (presisi) ──
# allow-src = "wintsix"              # hanya node ini yang boleh jadi pengirim
# allow-dst = "tsix-z", "tsix-c"     # hanya node ini yang boleh jadi tujuan
# deny-src  = "tsix-d"               # pengirim ini diblokir
# deny-dst  = "tsix-y"               # tujuan ini diblokir

[port]
# allow-dst = "*"     # semua port tujuan
# allow-src = "*"     # semua port sumber
# deny-dst  = 22, 24  # port tujuan yang diblokir
# deny-src  = 4000    # port sumber yang diblokir
