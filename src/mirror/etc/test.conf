# /etc/test.conf — contoh berkas konfigurasi untuk /opt/test/read-config
#
# Format: INI sederhana — [section] lalu `key = value`.
# Aturan nilai (lihat src/mirror/lib/ConfigParser.ts):
#   - nilai berkutip = string apa adanya
#   - koma di luar kutip = array
#   - true/false & yes/no & on/off = boolean
#   - angka desimal utuh = Number; `0755` tetap string (niat oktal dijaga)

[section1]
item1 = 1234
item2 = abcd

[section2]
item21 = 123, 456, 789
item22 = "abc", 123, "xyz"
item23 = true
item24 = false
path   = "/tmp/a#b"        # '#' di dalam kutip bukan komentar
