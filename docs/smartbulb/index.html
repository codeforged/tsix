<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=0.7, maximum-scale=0.7, minimum-scale=0.5, width=device-width, height=device-height"
    />
    <title>JayaLaras IoT Control</title>
    <style type="text/css">
      .bulb {
        position: absolute;
        width: 30px;
        cursor: pointer;
      }
      #layout {
      }
      #layoutimage {
      }
    </style>
    <script type="text/javascript" src="jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="cygnus.rfc.js"></script>
    <script type="text/javascript">
      bulbCount = 16;
      bulbChildCount = 1;
      bulbs = [];
      bulbChilds = [];

      $(this).ready(function () {
        //$("#layout").css("height", window.innerHeight+"px");
        //ws = new WebSocket("ws://localhost:8080");
        wsconnect();

        RFC = new cygRFC(ws);

        ws.onmessage = function (data) {
          console.log("incoming: " + data.data.trim());
          var response = JSON.parse(data.data.trim());
          if (response.ret != 0) {
            //console.log("incoming: "+data.data.trim());
          }
          RFC.onmessage(data);
        };

        ws.onclose = function (e) {
          console.log(
            "Socket is closed. Reconnect will be attempted in 1 second.",
            e.reason,
          );
          setTimeout(function () {
            wsconnect();
          }, 1000);
        };

        setInterval(function () {
          if (ws.readyState == 3) {
            wsconnect();
          }
        }, 2000);

        function wsconnect() {
          //ws = new WebSocket("ws://131164110852.ip-dynamic.com:45452");
          // ws = new WebSocket("ws://192.168.0.119:45452");
          ws = new WebSocket("ws://192.168.1.204:45452");
          ws.onopen = function () {
            console.log("Connected!");
            // change position here ..
            setPos("#bulb_0", 175, 355); // ruang tengah depan
            setPos("#bulb_1", 320, 355); // ruang tengah belakang
            setPos("#bulb_2", 380, 180); // dapur
            setPos("#bulb_3", 185, 530); // kamar kakang
            setPos("#bulb_4", 355, 530); // kamar utama
            setPos("#bulb_5", 432, 600); // wc kamar
            setPos("#bulb_6", 265, 135); // wc utama
            setPos("#bulb_7", 175, 175); // ruang kerja
            setPos("#bulb_8", 425, 365); // taman
            setPos("#bulb_9", 70, 255); // teras
            setPos("#bulbChild_0", 380, 40); // paviliun
            bulbChilds[0].parent = 9;
            bulbs[0].port = 8;
            bulbs[1].port = 9;
            bulbs[2].port = 7;
            bulbs[7].port = 4;

            RFC.remoteCall(
              { name: "getAllPortStatus", params: [] },
              function (data) {
                if (data != 0) {
                  //console.log("reply: "+data);
                  for (var i = 0; i < data.length; i++) {
                    var imap = i;

                    if (imap == 15) imap = 0;
                    else if (imap == 8) imap = 1;
                    else if (imap == 7) imap = 2;
                    else if (imap == 4) imap = 7;

                    //setLight(imap, parseInt(data[i]));
                    setLight(imap, parseInt(data[i]));
                  }
                }
              },
            );
          };
        }

        for (var i = 0; i < bulbCount; i++) {
          var html =
            '<img class="bulb" id="bulb_' +
            i +
            '" src="bulboff.png" style="display:none;"/>';
          $("#layout").append(html);
          bulbs.push({
            id: "bulb_" + i,
            state: 0,
          });
        }

        // Generate bulbchild here ..
        for (var i = 0; i < bulbChildCount; i++) {
          var html =
            '<img class="bulb" id="bulbChild_' +
            i +
            '" src="bulboff.png" style="display:none;"/>';
          $("#layout").append(html);
          bulbChilds.push({
            id: "bulbChild_" + i,
            state: 0,
          });
        }

        // set event bulb handler here ..
        for (var i = 0; i < bulbCount; i++) {
          $("#bulb_" + i).click(function () {
            var id = parseInt($(this).attr("id").split("_")[1]);
            var val = !bulbs[id].state;
            RFC.remoteCall(
              { name: "setLight", params: [id, val] },
              function (data) {
                var json = JSON.parse(data);
                console.log("reply: " + data);
                setLight(json.id, json.val);
              },
            );
          });
        }

        // set event bulb child handler here ..
        for (var i = 0; i < bulbChildCount; i++) {
          $("#bulbChild_" + i).click(function () {
            var id = parseInt($(this).attr("id").split("_")[1]);
            var val = !bulbChilds[id].state;
            RFC.remoteCall(
              { name: "setLight", params: [bulbChilds[id].parent, val] },
              function (data) {
                var json = JSON.parse(data);
                console.log("reply: " + data);
                setLight(json.id, json.val);
              },
            );
          });
        }
      });

      function setPos(id, x, y) {
        $(id).css("left", x + "px");
        $(id).css("top", y + "px");
        $(id).css("display", "");
      }
      function setLight(id, onoff) {
        bulbs[id].state = onoff;
        if (id == 9) setChildLight(0, onoff);

        if (onoff == 0) $("#bulb_" + id).attr("src", "bulboff.png");
        else if (onoff == 1) $("#bulb_" + id).attr("src", "bulbon.png");
      }
      function setChildLight(id, onoff) {
        bulbChilds[id].state = onoff;
        //bulbs[bulbChilds[id].parent] = onoff;
        if (onoff == 0) $("#bulbChild_" + id).attr("src", "bulboff.png");
        else if (onoff == 1) $("#bulbChild_" + id).attr("src", "bulbon.png");
      }
    </script>
  </head>
  <body>
    <div id="layout">
      <img id="layoutimage" src="layoutrumah.png" />
    </div>
  </body>
</html>
