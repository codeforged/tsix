# src/sysconfig.conf — konfigurasi node TSIX (key-value, gaya /etc/fstab.conf).
# Aturan nilai: "teks" = string, a, b = array, true/false = boolean, 0o755 = oktal.
# Pemilih backend root: kernel.rootType = bkfs | host (lihat wiki/Virtual-File-System.md).

[kernel]
version = 0.3.3.20260924.1
database = system.db
rootType = bkfs
rootHostPath = ../mirror
bootLogPath = /logs/boot.log
verbose = true
distroName = Antigonon leptopus
engineName = TSIX-Dinawari

[logger]
defaultLevel = INFO
logFile = jsix.log
enableConsole = false

[scheduler]
workerEntryPath = ../userland/WorkerEntry.js
defaultPath = /bin
defaultCwd = /
bootEntry = init.js
defaultShell = tsh.ts
workerMaxOldGenMb = 192
workerMaxYoungGenMb = 32

[shell]
defaultUser = root
defaultHostname = mactsix
promptFormat = "&username@&hostname&usertype "
defaultRows = 24
defaultColumns = 80
historyPath = /.sh_history
ttyCount = 3
loginCount = 1

[network]
defaultDevice = smqtnl0
interfaces = "smqtnl0, smqtnl1"

[iface.smqtnl0]
broker = mqtt://192.168.1.204
address = mactsix
defaultPort = 1883

[iface.smqtnl1]
broker = mqtt://iot-hub.site
address = mactsix_2
defaultPort = 1883
