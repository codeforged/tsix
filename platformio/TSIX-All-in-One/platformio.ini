; ═══════════════════════════════════════════════════════════════
; TSIX-All-in-One — 4 varian main, ESP8266 & ESP32
;
; Varian dipilih lewat build flag (lihat src/main.cpp dispatcher):
;   APP_VARIANT_MINIMUM         → mqtnl minimum-sender
;   APP_VARIANT_MINIMUM_BINFEO  → mqtnl minimum-binfeo-sender (biner tersandi)
;   APP_VARIANT_LANTANA         → mqtnl lantana-sender (relay + data sensor Lantana)
;   APP_VARIANT_OTA             → ota-mqtnl (binary OTA + flash)
;
; Build contoh:
;   pio run -e minimum-esp32
;   pio run -e minimum-binfeo-esp32
;   pio run -e lantana-esp8266
;   pio run -e ota-esp32
; ═══════════════════════════════════════════════════════════════

[platformio]
default_envs = minimum-esp32

; ── Konfigurasi bersama (di-inherit semua env) ──
[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    rweather/Crypto
    knolleary/PubSubClient
; Varian di-`#include` dari src/main.cpp → jangan dikompilasi terpisah
build_src_filter = +<*> -<variants/*>

; ═══════════ VARIAN 1: mqtnl minimum-sender ═══════════
[env:minimum-esp32]
extends = common
platform = espressif32@^6.9.0
board = esp32dev
build_flags =
    -DAPP_VARIANT_MINIMUM

[env:minimum-esp8266]
extends = common
platform = espressif8266
board = nodemcuv2
upload_speed = 921600
build_flags =
    -DAPP_VARIANT_MINIMUM

; ═══════════ VARIAN 1b: mqtnl minimum-binfeo-sender ═══════════
[env:minimum-binfeo-esp32]
extends = common
platform = espressif32@^6.9.0
board = esp32dev
build_flags =
    -DAPP_VARIANT_MINIMUM_BINFEO

[env:minimum-binfeo-esp8266]
extends = common
platform = espressif8266
board = nodemcuv2
upload_speed = 921600
build_flags =
    -DAPP_VARIANT_MINIMUM_BINFEO

; ═══════════ VARIAN 2: mqtnl lantana-sender ═══════════
[env:lantana-esp32]
extends = common
platform = espressif32@^6.9.0
board = esp32dev
build_flags =
    -DAPP_VARIANT_LANTANA

[env:lantana-esp8266]
extends = common
platform = espressif8266
board = nodemcuv2
upload_speed = 921600
build_flags =
    -DAPP_VARIANT_LANTANA

; ═══════════ VARIAN 3: ota-mqtnl ═══════════
[env:ota-esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_echo = true
upload_speed = 921600
; Varian di-`#include` dari src/main.cpp → jangan dikompilasi terpisah
build_src_filter = +<*> -<variants/*>
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DAPP_VARIANT_OTA

[env:ota-esp32]
extends = common
platform = espressif32@^6.9.0
board = esp32dev
build_flags =
    -DAPP_VARIANT_OTA

[env:ota-esp8266]
extends = common
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
monitor_echo = true
build_flags =
    -DAPP_VARIANT_OTA
