[env:esp32]
; platform = espressif32 @ ^6.4.0
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
; Library dependencies
lib_deps =
    crypto

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
platform_packages =
  platformio/tool-openocd-esp32

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Library dependencies
lib_deps =
    crypto

upload_speed = 921600
monitor_speed = 115200