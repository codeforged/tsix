<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Widget Test Harness</title>

<!-- 🔥 Load emerald.ts asli via bundle -->
<script src="emerald-bundle.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a1a;
    color: #e0e0e0;
    padding: 20px;
  }
  h1 { color: #4caf50; font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  h2 { color: #2196f3; font-size: 16px; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #ffffff15; }
  .section {
    background: #111827; border-radius: 12px; padding: 20px; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;
  }
  .section.vertical { flex-direction: column; }
  .widget-label {
    font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px;
    width: 100%; margin-bottom: -8px;
  }
  .widget-label code { font-size: 10px; background: #1a1a2e; padding: 1px 5px; border-radius: 3px; color: #ff9800; }
  @keyframes tsix-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .tsix-badge-pulse { animation: tsix-pulse 1.5s ease-in-out infinite; }
  .tsix-taskbar-btn { transition: background 0.15s, border-color 0.15s; }
  .tsix-taskbar-btn:hover { background: rgba(76,175,80,0.1) !important; }
  .tsix-taskbar-btn.active { background: rgba(76,175,80,0.15) !important; }
</style>
</head>
<body>

<h1>🧪 Emerald Widget Test Harness</h1>
<p class="subtitle">
  Menggunakan <code>emerald.ts</code> asli via bundle ·
  <span id="widget-count">0</span> widgets rendered ·
  <code id="bundle-info"></code>
</p>

<div id="app"></div>

<script>
const E = Emerald;
const app = document.getElementById('app');

// Helper: render satu IDOMNode ke DOM
function r(node) {
  if (node === null || node === undefined) return null;
  if (Array.isArray(node)) {
    const container = document.createElement('div');
    container.style.display = 'contents';
    node.forEach(n => { const el = E.renderIDOM(n); if (el) container.appendChild(el); });
    return container;
  }
  return E.renderIDOM(node);
}

// Helper: buat section dengan label
function section(label, ...children) {
  const el = document.createElement('div');
  el.className = 'section';
  el.innerHTML = `<div class="widget-label">${label}</div>`;
  children.forEach(c => { const dom = r(c); if (dom) el.appendChild(dom); });
  return el;
}

function vSection(label, ...children) {
  const el = document.createElement('div');
  el.className = 'section vertical';
  el.innerHTML = `<div class="widget-label">${label}</div>`;
  children.forEach(c => { const dom = r(c); if (dom) el.appendChild(dom); });
  return el;
}

// ============================================================
// BASIC ELEMENTS
// ============================================================
app.appendChild(vSection(
  `🧱 Basic Elements <code>button, input, selectBox, textarea</code>`,
  E.div({ style: { display: "flex", gap: "12px", flexWrap: "wrap", alignItems: "center" } },
    E.button({ text: "Primary", style: { background: "#4caf50", color: "white", border: "none", padding: "8px 20px", borderRadius: "6px", cursor: "pointer", fontSize: "13px" } }),
    E.button({ text: "Danger", style: { background: "#f44336", color: "white", border: "none", padding: "8px 20px", borderRadius: "6px", cursor: "pointer", fontSize: "13px" } }),
    E.button({ text: "Disabled", disabled: true, style: { background: "#555", color: "#999", border: "none", padding: "8px 20px", borderRadius: "6px", fontSize: "13px" } }),
    E.input({ type: "text", placeholder: "Input text...", value: "Hello", style: { padding: "8px 12px", background: "#0f3460", color: "#e0e0e0", border: "1px solid #333", borderRadius: "6px", fontSize: "13px" } }),
    E.selectBox({ style: { padding: "8px 12px", background: "#0f3460", color: "#e0e0e0", border: "1px solid #333", borderRadius: "6px", fontSize: "13px" } },
      [{ value: "1", text: "Option 1" }, { value: "2", text: "Option 2" }, { value: "3", text: "Option 3" }]
    ),
    E.textarea({ text: "Multiline\ntext area", style: { padding: "8px", background: "#0f3460", color: "#e0e0e0", border: "1px solid #333", borderRadius: "6px", fontSize: "13px", width: "200px", height: "60px" } }),
  ),
));

// ============================================================
// BADGES & TASKBAR
// ============================================================
app.appendChild(vSection(
  `🔵 Badges &amp; Taskbar <code>badge, taskbarButton</code>`,
  E.div({ style: { display: "flex", gap: "24px", alignItems: "center", flexWrap: "wrap" } },
    E.span({ style: { display: "flex", alignItems: "center", gap: "8px" } }, E.text("Active:")), E.badge({ color: "#4caf50", size: 8 }),
    E.span({ style: { display: "flex", alignItems: "center", gap: "8px" } }, E.text("Warning:")), E.badge({ color: "#ff9800", size: 8 }),
    E.span({ style: { display: "flex", alignItems: "center", gap: "8px" } }, E.text("Error:")), E.badge({ color: "#f44336", size: 8 }),
    E.span({ style: { display: "flex", alignItems: "center", gap: "8px" } }, E.text("Static:")), E.badge({ color: "#9c27b0", size: 8, pulse: false }),
  ),
  E.div({ style: { display: "flex", gap: "8px", flexWrap: "wrap", marginTop: "12px" } },
    E.taskbarButton({ icon: "📝", label: "Notepad", active: true }),
    E.taskbarButton({ icon: "🌐", label: "Browser" }),
    E.taskbarButton({ icon: "⚙️", label: "Settings", badge: E.badge({ color: "#f44336", size: 6 }) }),
    E.taskbarButton({ icon: "📁", label: "Files", active: true, badge: E.badge({ color: "#4caf50", size: 6 }) }),
  ),
));

// ============================================================
// SENSOR CARDS
// ============================================================
const sensorSection = section(`📊 Sensor Cards <code>sensorCard</code>`);
sensorSection.style.alignItems = 'flex-start';
sensorSection.appendChild(r(E.sensorCard({ id: "temp", label: "Temperature", unit: "°C", icon: "🌡️", color: "#f44336", value: 72, min: 0, max: 100 })));
sensorSection.appendChild(r(E.sensorCard({ id: "hum", label: "Humidity", unit: "%", icon: "💧", color: "#2196f3", value: 45, min: 0, max: 100 })));
sensorSection.appendChild(r(E.sensorCard({ id: "press", label: "Pressure", unit: "hPa", icon: "🌀", color: "#ff9800", value: 1013, min: 950, max: 1050 })));
sensorSection.appendChild(r(E.sensorCard({ id: "co2", label: "CO₂ Level", unit: "ppm", icon: "🌿", color: "#4caf50", value: 420, min: 300, max: 2000 })));
sensorSection.appendChild(r(E.sensorCard({ id: "empty", label: "Offline", unit: "", icon: "📡", color: "#666" })));
app.appendChild(sensorSection);

// ============================================================
// RELAY CARDS
// ============================================================
const relaySection = section(`⚡ Relay Cards <code>relayCard</code>`);
relaySection.style.alignItems = 'flex-start';
relaySection.appendChild(r(E.relayCard({ id: "fan", label: "FAN", icon: "🌀", color: "#4caf50", active: true })));
relaySection.appendChild(r(E.relayCard({ id: "pump", label: "PUMP", icon: "💧", color: "#2196f3", active: false })));
relaySection.appendChild(r(E.relayCard({ id: "light", label: "LIGHT", icon: "💡", color: "#ff9800", active: true })));
relaySection.appendChild(r(E.relayCard({ id: "alarm", label: "ALARM", icon: "🔔", color: "#f44336", active: false })));
app.appendChild(relaySection);

// ============================================================
// LINE CHARTS
// ============================================================
const chartSection = section(`📈 Line Charts <code>lineChart</code>`);
chartSection.style.alignItems = 'flex-start';
chartSection.appendChild(r(E.lineChart({ title: "📊 Temperature (°C)", data: [25, 30, 28, 35, 32, 38, 36, 42, 39, 45, 41, 48], color: "#f44336", spline: true, fill: true, width: 280, height: 160 })));
chartSection.appendChild(r(E.lineChart({ title: "📊 Humidity (%)", data: [60, 55, 58, 50, 52, 48, 45, 42, 44, 40, 38, 35], color: "#2196f3", spline: true, fill: true, width: 280, height: 160 })));
chartSection.appendChild(r(E.lineChart({ title: "📊 Pressure (hPa)", data: [1012, 1015, 1010, 1018, 1013, 1008, 1011, 1016, 1014, 1019, 1015, 1021], color: "#ff9800", spline: true, fill: true, width: 280, height: 160 })));
chartSection.appendChild(r(E.lineChart({ title: "📊 Straight Line", data: [10, 20, 30, 40, 50, 60, 70, 80], color: "#9c27b0", spline: false, fill: false, width: 280, height: 160 })));
app.appendChild(chartSection);

// ============================================================
// RADIAL GAUGES
// ============================================================
const gaugeSection = section(`🎯 Radial Gauges <code>radialGauge</code>`);
gaugeSection.style.alignItems = 'flex-start';
gaugeSection.appendChild(r(E.radialGauge({ id: "rg0", value: 72, min: 0, max: 100, color: "#4caf50", label: "CPU", unit: "%", size: 120 })));
gaugeSection.appendChild(r(E.radialGauge({ id: "rg1", value: 45, min: 0, max: 100, color: "#2196f3", label: "Memory", unit: "%", size: 120 })));
gaugeSection.appendChild(r(E.radialGauge({ id: "rg2", value: 88, min: 0, max: 100, color: "#f44336", label: "Disk", unit: "%", size: 120 })));
gaugeSection.appendChild(r(E.radialGauge({ id: "rg3", value: 25, min: 0, max: 100, color: "#ff9800", label: "Network", unit: "%", size: 120 })));
app.appendChild(gaugeSection);

// ============================================================
// SEVEN SEGMENT
// ============================================================
const segSection = section(`💡 Seven Segment <code>sevenSegment</code>`);
segSection.style.alignItems = 'flex-start';
segSection.appendChild(r(E.sevenSegment({ value: 42.5, digits: 4, decimals: 1, color: "#4caf50", label: "🌡️ Temperature" })));
segSection.appendChild(r(E.sevenSegment({ value: 2025, digits: 4, decimals: 0, color: "#2196f3", label: "📅 Year" })));
segSection.appendChild(r(E.sevenSegment({ value: -3.14, digits: 4, decimals: 2, color: "#f44336", label: "📐 Pi (negated)" })));
segSection.appendChild(r(E.sevenSegment({ value: 88.8, digits: 3, decimals: 1, color: "#ff9800", label: "⚡ Voltage" })));
app.appendChild(segSection);

// ============================================================
// INDICATOR LAMPS
// ============================================================
const lampSection = section(`💡 Indicator Lamps <code>indicatorLamp</code>`);
lampSection.style.alignItems = 'flex-start';
lampSection.appendChild(r(E.indicatorLamp({ id: "power", color: "#4caf50", on: true, label: "POWER", size: 36 })));
lampSection.appendChild(r(E.indicatorLamp({ id: "alarm", color: "#f44336", on: false, label: "ALARM", size: 36 })));
lampSection.appendChild(r(E.indicatorLamp({ id: "warn", color: "#ff9800", on: true, label: "WARNING", size: 36 })));
lampSection.appendChild(r(E.indicatorLamp({ id: "net", color: "#2196f3", on: false, label: "NETWORK", size: 36 })));
lampSection.appendChild(r(E.indicatorLamp({ id: "mini", color: "#9c27b0", on: true, label: "MINI", size: 24 })));
app.appendChild(lampSection);

// ============================================================
// TOGGLE SWITCHES
// ============================================================
const toggleSection = section(`🔘 Toggle Switches <code>toggleSwitch</code>`);
toggleSection.style.alignItems = 'flex-start';
toggleSection.appendChild(r(E.toggleSwitch({ id: "t1", color: "#4caf50", on: true, label: "ON", size: 48 })));
toggleSection.appendChild(r(E.toggleSwitch({ id: "t2", color: "#f44336", on: false, label: "OFF", size: 48 })));
toggleSection.appendChild(r(E.toggleSwitch({ id: "t3", color: "#2196f3", on: true, label: "ACTIVE", size: 36 })));
toggleSection.appendChild(r(E.toggleSwitch({ id: "t4", color: "#ff9800", on: false, label: "STANDBY", size: 36 })));
app.appendChild(toggleSection);

// ============================================================
// VERTICAL GAUGES
// ============================================================
const vgSection = section(`🧪 Vertical Gauges <code>verticalGauge</code>`);
vgSection.style.alignItems = 'flex-start';
vgSection.appendChild(r(E.verticalGauge({ id: "vg1", value: 75, color: "#2196f3", label: "Water Level", unit: "%" })));
vgSection.appendChild(r(E.verticalGauge({ id: "vg2", value: 45, color: "#4caf50", label: "Fuel", unit: "%" })));
vgSection.appendChild(r(E.verticalGauge({ id: "vg3", value: 90, color: "#f44336", label: "Temperature", unit: "°C" })));
vgSection.appendChild(r(E.verticalGauge({ id: "vg4", value: 20, color: "#ff9800", label: "Battery", unit: "%" })));
vgSection.appendChild(r(E.verticalGauge({ id: "vg5", value: 60, color: "#9c27b0", label: "Pressure", unit: "hPa" })));
app.appendChild(vgSection);

// ============================================================
// SLIDERS
// ============================================================
const sliderSection = section(`🎚️ Sliders <code>slider</code>`);
sliderSection.style.alignItems = 'flex-start';
sliderSection.appendChild(r(E.slider({ id: "s1", label: "Volume", value: 75, min: 0, max: 100, color: "#4caf50", unit: "%" })));
sliderSection.appendChild(r(E.slider({ id: "s2", label: "Brightness", value: 60, min: 0, max: 100, color: "#ff9800", unit: "%" })));
sliderSection.appendChild(r(E.slider({ id: "s3", label: "Frequency", value: 2400, min: 2000, max: 2600, color: "#2196f3", unit: " MHz" })));
sliderSection.appendChild(r(E.slider({ id: "s4", label: "Threshold", value: 50, min: 0, max: 200, color: "#f44336" })));
app.appendChild(sliderSection);

// ============================================================
// IMAGE
// ============================================================
const imgSection = section(`🖼️ Image Widget <code>image</code>`);
imgSection.style.alignItems = 'flex-start';
imgSection.appendChild(r(E.image({
    src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#4caf50" rx="10"/><circle cx="50" cy="50" r="20" fill="#fff"/></svg>'),
    alt: "Test Image", width: 100, height: 100,
    style: { borderRadius: "8px", border: "2px solid #4caf50" }
  })));
imgSection.appendChild(r(E.image({
    src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><circle cx="40" cy="40" r="35" fill="#2196f3"/><text x="40" y="45" fill="white" font-size="20" text-anchor="middle">JS</text></svg>'),
    alt: "JavaScript", style: { borderRadius: "50%", border: "2px solid #2196f3", width: "80px", height: "80px" }
  })));
app.appendChild(imgSection);

// ============================================================
// STANDALONE SVG BUILDERS
// ============================================================
const svgSection = document.createElement('div');
svgSection.className = 'section';
svgSection.style.alignItems = 'flex-start';
svgSection.innerHTML = `<div class="widget-label">🔧 Standalone SVG Builders <code>buildLineChartSvg, buildRadialGaugeSvg, buildToggleSwitchImg</code></div>`;

const chartSvg = document.createElement('div');
chartSvg.style.cssText = 'flex: 1; min-width: 280px; background: #16213e; border-radius: 10px; padding: 14px; border: 1px solid #4caf5044; overflow: hidden;';
chartSvg.innerHTML = E.buildLineChartSvg({ data: [5, 15, 8, 22, 18, 28], color: "#4caf50", spline: true, fill: true, width: 280, height: 150 });
svgSection.appendChild(chartSvg);

const gaugeSvg = document.createElement('div');
gaugeSvg.style.cssText = 'flex: 1; min-width: 160px; background: #16213e; border-radius: 10px; padding: 14px; border: 1px solid #2196f344; overflow: hidden;';
gaugeSvg.innerHTML = E.buildRadialGaugeSvg({ value: 67, min: 0, max: 100, color: "#2196f3", unit: "%", size: 120 });
svgSection.appendChild(gaugeSvg);

const toggleSvg = document.createElement('div');
toggleSvg.style.cssText = 'display: flex; align-items: center; gap: 16px; flex: 1; min-width: 160px; background: #16213e; border-radius: 10px; padding: 14px; border: 1px solid #ff980044; overflow: hidden;';
toggleSvg.innerHTML = E.buildToggleSwitchImg({ color: "#ff9800", on: true, size: 48 })
  + E.buildToggleSwitchImg({ color: "#ff9800", on: false, size: 48 });
svgSection.appendChild(toggleSvg);
app.appendChild(svgSection);

// ============================================================
// UPDATE COUNTER
// ============================================================
const totalWidgets = document.querySelectorAll('[id^="sc-"],[id^="rc-"],[id^="lc-html"],[id^="rg-html"],[id^="ss-html"],[id^="il-"],[id^="ts-"],[id^="sl-"]').length;
document.getElementById('widget-count').textContent = totalWidgets;
document.getElementById('bundle-info').textContent = `emerald-bundle.js · ${totalWidgets} widgets`;

console.log('✅ Emerald test harness using', 'emerald-bundle.js (from emerald.ts asli)');

// ============================================================
// LIVE SIMULATION — update data tiap 4 detik, transisi smooth via CSS
// ============================================================
function startLiveSimulation() {
  function rand(min, max) { return Math.round(min + Math.random() * (max - min)); }

  // Nilai static yang di-update periodik
  let sensors = [72, 45, 1013, 420];
  let chartHistories = {
    temp: Array.from({ length: 12 }, () => rand(30, 70)),
    hum: Array.from({ length: 12 }, () => rand(20, 80)),
    press: Array.from({ length: 12 }, () => rand(1000, 1025)),
    line: Array.from({ length: 8 }, () => rand(10, 90)),
  };
  let gaugeVals = [72, 45, 88, 25];
  let segVal1 = 42.5, segVal4 = 88.8;
  let vgVals = [75, 45, 90, 20, 60];

  // Update tiap 4 detik — data berubah drastis, CSS transition yg bikin halus
  setInterval(() => {
    const t = Date.now() / 1000;

    // --- Sensor Cards ---
    const sensorIds = ["temp", "hum", "press", "co2"];
    const sensorColors = ["#f44336", "#2196f3", "#ff9800", "#4caf50"];
    sensors = sensors.map((_, i) => rand(20, 80));
    for (let i = 0; i < sensorIds.length; i++) {
      const id = sensorIds[i];
      const val = sensors[i];
      const pct = Math.min(100, Math.max(0, val));
      const valEl = document.getElementById(`sv-${id}`);
      const barEl = document.getElementById(`bar-${id}`);
      if (valEl) valEl.textContent = val.toFixed(1);
      if (barEl) barEl.style.width = `${pct}%`;
    }

    // --- Line Charts (refresh data) ---
    for (const key of Object.keys(chartHistories)) {
      chartHistories[key].push(rand(20, 80));
      chartHistories[key].shift();
    }
    const chartEls = [
      { el: document.getElementById('lc-html-chart-temp'), data: chartHistories.temp, color: "#f44336" },
      { el: document.getElementById('lc-html-chart-hum'), data: chartHistories.hum, color: "#2196f3" },
      { el: document.getElementById('lc-html-chart-press'), data: chartHistories.press, color: "#ff9800" },
      { el: document.getElementById('lc-html-chart-line'), data: chartHistories.line, color: "#9c27b0" },
    ];
    chartEls.forEach(c => { if (c.el) c.el.innerHTML = E.buildLineChartSvg({ data: c.data, color: c.color, spline: true, fill: true, width: 280, height: 160 }); });

    // --- Radial Gauges (CSS transition smooth — arc + needle) ---
    gaugeVals = gaugeVals.map(() => rand(10, 95));
    const startAngle = -220, range = 260, size = 120;
    const radius2 = size * 0.36;
    const arcLen = radius2 * range * Math.PI / 180;
    for (let i = 0; i < 4; i++) {
      const pct = gaugeVals[i] / 100;
      const angle = startAngle + range * pct;
      const group = document.getElementById(`rg-needle-group-rg${i}`);
      const valEl = document.getElementById(`rg-val-rg${i}`);
      const arc = document.getElementById(`rg-arc-rg${i}`);
      if (group) group.style.transform = `rotate(${angle}deg)`;
      if (valEl) valEl.textContent = gaugeVals[i].toString();
      if (arc) arc.style.strokeDashoffset = (arcLen * (1 - pct)).toString();
    }

    // --- Seven Segment ---
    segVal1 = rand(30, 55);
    segVal4 = rand(60, 110);
    const ssEls = document.querySelectorAll('[id^="ss-html-"]');
    if (ssEls[0]) ssEls[0].innerHTML = E.buildSevenSegmentHtml({ value: segVal1, digits: 4, decimals: 1, color: "#4caf50" });
    if (ssEls[3]) ssEls[3].innerHTML = E.buildSevenSegmentHtml({ value: segVal4, digits: 3, decimals: 1, color: "#ff9800" });

    // --- Indicator Lamps ---
    const lampOn = Math.floor(t / 4) % 2 === 0;
    [
      { id: "power", color: "#4caf50", on: lampOn, size: 36 },
      { id: "alarm", color: "#f44336", on: !lampOn, size: 36 },
      { id: "warn", color: "#ff9800", on: lampOn, size: 36 },
      { id: "net", color: "#2196f3", on: !lampOn, size: 36 },
      { id: "mini", color: "#9c27b0", on: lampOn, size: 24 },
    ].forEach(l => {
      const el = document.getElementById(`il-html-${l.id}`);
      const lbl = document.getElementById(`il-label-${l.id}`);
      if (el) { const r = E.buildIndicatorLampImg(l); el.innerHTML = r.innerHTML; }
      if (lbl) lbl.style.color = l.on ? l.color : "#666";
    });

    // --- Toggle Switches ---
    const togOn = Math.floor(t / 4) % 2 === 0;
    [
      { id: "t1", color: "#4caf50", on: togOn, size: 48 },
      { id: "t2", color: "#f44336", on: !togOn, size: 48 },
      { id: "t3", color: "#2196f3", on: togOn, size: 36 },
      { id: "t4", color: "#ff9800", on: !togOn, size: 36 },
    ].forEach(t => {
      const el = document.getElementById(`ts-html-${t.id}`);
      if (el) el.innerHTML = E.buildToggleSwitchImg(t);
    });

    // --- Vertical Gauges (CSS transition smooth) ---
    vgVals = vgVals.map(() => rand(10, 95));
    const H = 160, r2 = 10;
    for (let i = 0; i < vgVals.length; i++) {
      const val = vgVals[i];
      const fillH = Math.max(0, ((H - r2 * 2) * val) / 100);
      const waterY = H - r2 - Math.min(fillH, H - r2 * 2);
      const id = ["vg1","vg2","vg3","vg4","vg5"][i];
      ["water","grad"].forEach(type => {
        const el = document.getElementById(`wg-${type}-${id}`);
        if (el) el.style.transform = `translateY(${waterY}px)`;
      });
      const surf = document.getElementById(`wg-surface-${id}`);
      if (surf) { surf.setAttribute('y1', waterY); surf.setAttribute('y2', waterY); }
      const txt = document.getElementById(`wg-val-${id}`);
      if (txt) txt.textContent = val.toString();
    }

  }, 1000);
}

startLiveSimulation();
</script>
</body>
</html>
